app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-run/gnupg:create
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260819.2/Keyguard-3.0.4-linux-x86_64.tar.gz
        sha256: 0bc073ebe7ca50a09a9fcf0202dfe511a4118e0da4f3fce3dc69842fb10dfabc
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260819.2/Keyguard-3.0.4-linux-aarch64.tar.gz
        sha256: 025145bc6eace7bfddf83869e483a35606af12316d354a237ed336f1d788ca45
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
