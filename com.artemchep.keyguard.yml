app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260527/Keyguard-2.13.0-linux-x86_64.tar.gz
        sha256: b2a5316bc60be2cf2ebec2495613bff151ea45da940d505a0a19a395ad327161
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260527/Keyguard-2.13.0-linux-aarch64.tar.gz
        sha256: eb08cf9f42212b47dfdb413e476c35b2211ae8005951645ef45e7ee0204bbd93
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
