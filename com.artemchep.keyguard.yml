app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260123/Keyguard-2.3.1-linux-x86_64.tar.gz
        sha256: 9093821a7dcac6367e57f8d83b4763293b852814baa090bb38747aa72ddce551
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260123/Keyguard-2.3.1-linux-aarch64.tar.gz
        sha256: 1f3df7e58599318503afd7d414c580a724688ed4629b000849230813ca788fbb
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
