app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260328/Keyguard-2.7.0-linux-x86_64.tar.gz
        sha256: 1697490f1d1a393880e0c4eb246e9d87c10b4dc6407ef44dea0bff8beef8cb9a
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260328/Keyguard-2.7.0-linux-aarch64.tar.gz
        sha256: df3c1ff1c776e24e7bf16908bfea3c376de3d30a1d5503ee3ea2d34c474b9f84
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
