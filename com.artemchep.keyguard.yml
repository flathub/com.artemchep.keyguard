app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  # Yubikey/FIDO2 security keys; no narrower permission exposes /dev/hidraw
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/gnupg:create
  # Browser extension: the native messaging manifests of the browsers on the host.
  # No :create, so the sandbox sees only the folders that exist, which is how it
  # tells which browsers are used.
  - --filesystem=xdg-config/google-chrome/NativeMessagingHosts
  - --filesystem=xdg-config/chromium/NativeMessagingHosts
  - --filesystem=xdg-config/microsoft-edge/NativeMessagingHosts
  - --filesystem=xdg-config/BraveSoftware/Brave-Browser/NativeMessagingHosts
  - --filesystem=xdg-config/vivaldi/NativeMessagingHosts
  - --filesystem=~/.mozilla/native-messaging-hosts
  # The same folders of the browsers from Flathub. Keyguard copies its connector
  # there and its CLI agent listens next to it: their sandboxes see nothing else.
  - --filesystem=~/.var/app/com.google.Chrome/config/google-chrome/NativeMessagingHosts
  - --filesystem=~/.var/app/org.chromium.Chromium/config/chromium/NativeMessagingHosts
  - --filesystem=~/.var/app/com.microsoft.Edge/config/microsoft-edge/NativeMessagingHosts
  - --filesystem=~/.var/app/com.brave.Browser/config/BraveSoftware/Brave-Browser/NativeMessagingHosts
  - --filesystem=~/.var/app/org.mozilla.firefox/.mozilla/native-messaging-hosts
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.PolicyKit1
  # glibc gives the threads that allocate at the same time a malloc arena each,
  # up to eight per core, and the app has about a hundred of them: hundreds of
  # megabytes that hold almost nothing. Only the environment can cap them, and
  # only here: outside of a sandbox the programs the app starts would inherit it.
  - --env=MALLOC_ARENA_MAX=2
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20261127/Keyguard-3.10.0-linux-x86_64.tar.gz
        sha256: eba6f337e1ce3f4bb585b2eb8a66c796ace05999ca08675ae3b57269cec8bd81
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20261127/Keyguard-3.10.0-linux-aarch64.tar.gz
        sha256: c1ed67fb14d3e8d505ec114d6bd700e21f4ed96e44be322b4f920e70028ed236
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
