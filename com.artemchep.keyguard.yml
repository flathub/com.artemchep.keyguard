app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --filesystem=xdg-download
  - --filesystem=xdg-run/gnupg:create
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260616/Keyguard-2.14.2-linux-x86_64.tar.gz
        sha256: e77641ca3314fb4c41d41358e59c80ae19a650cd48aa01986f99d8c2e1be6f78
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20260616/Keyguard-2.14.2-linux-aarch64.tar.gz
        sha256: 5f066ea4ad640dc49e23e23756fc10cab1c466cb82f9625feb3484176660b6ce
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
