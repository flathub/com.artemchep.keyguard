app-id: com.artemchep.keyguard
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
tags: [proprietary]
command: Keyguard
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  # Yubikey/FIDO2 security keys; no narrower permission exposes /dev/hidraw
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/gnupg:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --system-talk-name=org.freedesktop.PolicyKit1
modules:
  - name: keyguard
    buildsystem: simple
    build-commands:
      - mv * /app
      - chmod +x /app/bin/Keyguard
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://github.com/AChep/keyguard-app/releases/download/r20261109/Keyguard-3.8.0-linux-x86_64.tar.gz
        sha256: bf08fee1dec2fc0052f664555df3d258adeb9d05f0fb5882de396642e8b778c3
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-(?:amd64|x86_64)\.tar\.gz).*
      - type: archive
        only-arches:
          - aarch64
        url: https://github.com/AChep/keyguard-app/releases/download/r20261109/Keyguard-3.8.0-linux-aarch64.tar.gz
        sha256: a6873985af798f0b70fa57873c1147850d0581eb61403537682eefdfa96bdb29
        x-checker-data:
          type: html
          url: https://api.github.com/repos/AChep/keyguard-app/releases/latest
          pattern: .*(https://github\.com/AChep/keyguard-app/releases/download/r.*/Keyguard-([\d\.]+)-linux-aarch64\.tar\.gz).*
